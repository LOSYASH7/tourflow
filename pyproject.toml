[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tourflow"
version = "0.1.0"
description = "Прогнозно-аналитическая система: турпоток в регион по видам размещения"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "PyYAML>=6.0,<7",
    "pandera>=0.20,<1",
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.3,<5",
    "shap>=0.45,<1",
    "joblib>=1.3,<2",
    "mlflow-skinny>=2.12,<4",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35,<2", "plotly>=5.20,<8"]
orchestration = ["prefect>=3.0,<4"]
dev = ["pytest>=8", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
tourflow = "tourflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
